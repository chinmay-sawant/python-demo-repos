[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "django-flash-sale-inventory/inventory/migrations",
]

[tool.ruff.lint]
external = ["V107"]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "S",  # bandit-style security (ruff subset)
    "C4", # flake8-comprehensions
    "RUF",# ruff-specific
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
"*/tests/**" = ["S101", "S106", "S311"]
"**/bench/**" = ["E402", "S106", "S311"]
"fastapi-live-metrics-ingest/app/main.py" = ["E402"]
"flask-partner-webhook-relay/app/services/delivery.py" = ["S311"]
"flask-partner-webhook-relay/app/database.py" = ["UP040"]

[tool.bandit]
exclude_dirs = ["tests", "migrations", "bench"]

[tool.vulture]
exclude = ["**/tests/**", "**/bench/**", "**/migrations/**"]
